    // Helper per convertir URLs de YouTube o Vimeo en URLs d'embed netes
    function normalizeVideoEmbedUrl(url) {
      if (!url) return '';
      const trimmed = url.trim();
      const ytMatch = trimmed.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        return `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&rel=0&modestbranding=1`;
      }
      const vimeoMatch = trimmed.match(/vimeo\.com\/(\d+)/);
      if (vimeoMatch && !trimmed.includes('player.vimeo.com')) {
        return `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1&title=0&byline=0&portrait=0`;
      }
      return trimmed;
    }

    function getLocalizedProject(project, lang) {
      const localized = project.i18n?.[lang] || project.i18n?.ca || {};
      return {
        type: localized.type || project.type || 'FILM',
        shortDesc: localized.shortDesc || project.shortDesc || '',
        description: localized.description || project.description || ''
      };
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
      } catch (e) {}
      document.body.removeChild(ta);
    }

    function App() {

      const heroVideoRef = useRef(null);

      // Drecera secreta Shift + D o #admin a la URL per obrir el CMS del Director
      useEffect(() => {
        const checkHash = () => {
          if (window.location.hash === '#admin' || window.location.search.includes('admin=1')) {
            setShowPinPrompt(true);
          }
        };
        checkHash();
        window.addEventListener('hashchange', checkHash);

        const handleKeyDown = (e) => {
          const tag = document.activeElement?.tagName?.toLowerCase();
          if (tag !== 'input' && tag !== 'textarea' && e.shiftKey && (e.key === 'D' || e.key === 'd')) {
            e.preventDefault();
            if (isAdminUnlocked) {
              setIsStudioDrawerOpen((prev) => !prev);
            } else {
              setShowPinPrompt(true);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('hashchange', checkHash);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [isAdminUnlocked]);

      // Desa els canvis al navegador i prepara l'exportació per a Vercel
      const saveChanges = (updatedProjects = projects, updatedHero = heroVideoUrl, updatedPhoto = aboutPhotoUrl) => {
        setSaveStatus('DESANT...');

          localStorage.setItem('ventura_cms_projects_v1', JSON.stringify(updatedProjects));

      // Control del scroll per ancorar la barra blanca esmerilada a dalt
      useEffect(() => {
        const handleScroll = () => {
          const dockThreshold = window.innerHeight - 84;
          setIsNavDocked(window.scrollY >= dockThreshold);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });

      useEffect(() => {

      // Carregador en viu dels arxius .TTF des del teu Mac
      const handleFontFileUpload = async (e, fontTarget) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const buffer = await file.arrayBuffer();
          const familyName = fontTarget === 'nicholas' ? 'NicholasCustom' : 'FieldGothicCustom';
          const fontFace = new FontFace(familyName, buffer);
          const loadedFace = await fontFace.load();
          document.fonts.add(loadedFace);
          setLoadedFontsStatus((prev) => ({ ...prev, [fontTarget]: file.name }));
        } catch (err) {
          console.error('Error carregant la font TTF:', err);
        }
      };

      const handleAboutPhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 1600;
            const scale = img.width > maxW ? maxW / img.width : 1;
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
            setAboutPhotoUrl(compressedDataUrl);
            saveChanges(projects, heroVideoUrl, compressedDataUrl);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);

            <button
              onClick={() => setIsStudioDrawerOpen(true)}
              className="fixed bottom-5 right-5 z-40 px-4 py-2.5 bg-[#B40023] hover:bg-red-700 text-[#FCF0D6] border border-[#FCF0D6]/30 rounded-[2px] font-field-bold text-[10px] tracking-[0.22em] uppercase flex items-center gap-2 shadow-2xl transition-all"
            >
              <IconSliders className="w-3.5 h-3.5" />
              <span>DIRECTOR CMS (OBERT)</span>
            </button>
          )}

          {isAdminUnlocked && isStudioDrawerOpen && (
            <div
              className="fixed inset-0 z-[115] bg-black/80 backdrop-blur-md flex justify-end"
              onClick={() => setIsStudioDrawerOpen(false)}
            >
              <div
                className="w-full max-w-xl bg-[#0B0B0B] border-l border-[#FCF0D6]/20 h-full p-5 sm:p-8 overflow-y-auto flex flex-col justify-between text-[#FCF0D6]"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="space-y-6">
                  <div className="flex items-center justify-between border-b border-white/15 pb-4">
                    <div className="flex items-center gap-2.5">
                      <VenturaIsotipo className="w-6 h-6" color="#B40023" />
                      <div>
                        <h3 className="font-field-bold text-sm tracking-[0.2em] uppercase">
                          VENTURA DIRECTOR CMS
                        </h3>
                        <span className="text-[10px] font-field-medium tracking-widest text-[#FFD447] uppercase">
                          NOMÉS VISIBLE PER A TU • OCULT AL PÚBLIC
                        </span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => {
                          setIsAdminUnlocked(false);
                          setIsStudioDrawerOpen(false);
                        }}
                        className="px-2.5 py-1 bg-white/10 hover:bg-white/20 text-[10px] font-field-bold tracking-wider uppercase rounded-[2px]"
                      >
                        BLOQUEJAR
                      </button>
                      <button
                        onClick={() => setIsStudioDrawerOpen(false)}
                        className="p-1.5 hover:bg-white/10 rounded"
                      >
                        <IconX className="w-4 h-4" />
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2 bg-black p-1 rounded-[3px] border border-white/10">
                    <button
                      onClick={() => setAdminTab('projects')}
                      className={`py-2 font-field-bold text-[10px] tracking-[0.18em] uppercase rounded-[2px] transition-colors ${
                        adminTab === 'projects' ? 'bg-[#B40023] text-white' : 'text-[#FCF0D6]/60 hover:text-white'
                      }`}
                    >
                      1. PROJECTES ({projects.length})
                    </button>
                    <button
                      onClick={() => setAdminTab('global')}
                      className={`py-2 font-field-bold text-[10px] tracking-[0.18em] uppercase rounded-[2px] transition-colors ${
                        adminTab === 'global' ? 'bg-[#B40023] text-white' : 'text-[#FCF0D6]/60 hover:text-white'
                      }`}
                    >
                      2. HERO / B&amp;W / TTF
                    </button>
                    <button
                      onClick={() => setAdminTab('export')}
                      className={`py-2 font-field-bold text-[10px] tracking-[0.18em] uppercase rounded-[2px] transition-colors ${
                        adminTab === 'export' ? 'bg-[#B40023] text-white' : 'text-[#FCF0D6]/60 hover:text-white'
                      }`}
                    >
                      3. EXPORTAR JSON
                    </button>
                  </div>

                  {adminTab === 'projects' && currentEditingProject && (
                    <div className="space-y-4">
                      <div className="flex items-center justify-between gap-2">
                        <select
                          value={editingProjectId}
                          onChange={(e) => setEditingProjectId(e.target.value)}
                          className="flex-1 bg-black border border-white/25 px-3 py-2.5 text-xs font-field-bold uppercase text-[#FCF0D6] rounded-[2px]"
                        >
                          {projects.map((p) => (
                            <option key={p.id} value={p.id}>
                              [{p.index}] {p.title}
                            </option>
                          ))}
                        </select>
                        <button
                          onClick={handleAddNewProject}
                          className="px-3 py-2.5 bg-white/10 hover:bg-[#B40023] text-[#FCF0D6] font-field-bold text-[10px] tracking-wider uppercase rounded-[2px] flex items-center gap-1 shrink-0"
                        >
                          <IconPlus className="w-3.5 h-3.5" />
                          <span>NOU</span>
                        </button>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                        <div className="col-span-2">
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            TÍTOL
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.title}
                            onChange={(e) => handleAdminProjectChange('title', e.target.value)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            DURADA
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.duration}
                            onChange={(e) => handleAdminProjectChange('duration', e.target.value)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            ANY
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.year}
                            onChange={(e) => handleAdminProjectChange('year', e.target.value)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            LOCALITZACIÓ
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.location}
                            onChange={(e) => handleAdminProjectChange('location', e.target.value)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            PREMIS / FESTIVALS
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.awards}
                            onChange={(e) => handleAdminProjectChange('awards', e.target.value)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                      </div>

                      <div className="space-y-2.5 pt-2 border-t border-white/10">
                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FFD447] mb-1">
                            ENLLAÇ VIMEO O YOUTUBE (S'OBRE EN FER CLIC)
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.embedUrl}
                            onChange={(e) => handleAdminProjectChange('embedUrl', e.target.value)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            VÍDEO CURT EN LOOP DE LA TARGETA (.MP4)
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.videoPreview}
                            onChange={(e) => handleAdminProjectChange('videoPreview', e.target.value)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            IMATGE PÒSTER DE LA TARGETA (URL)
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.poster}
                            onChange={(e) => handleAdminProjectChange('poster', e.target.value)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                      </div>

                      <div className="space-y-3 pt-3 border-t border-white/10">
                        <div className="flex items-center justify-between">
                          <span className="font-field-bold text-[10px] tracking-[0.2em] uppercase text-[#B40023]">
                            TEXTOS EN {LANGUAGES.find((l) => l.code === lang)?.full.toUpperCase()} ({lang.toUpperCase()})
                          </span>
                          <div className="flex gap-1">
                            {LANGUAGES.map((l) => (
                              <button
                                key={l.code}
                                type="button"
                                onClick={() => setLang(l.code)}
                                className={`px-2 py-0.5 text-[10px] font-field-bold uppercase rounded-[2px] ${
                                  lang === l.code ? 'bg-[#B40023] text-white' : 'bg-white/10 text-white/60'
                                }`}
                              >
                                {l.label}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            CATEGORIA / TIPUS ({lang.toUpperCase()})
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.i18n?.[lang]?.type || ''}
                            onChange={(e) => handleAdminProjectChange('type', e.target.value, lang)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>

                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            FRASE CURTA DE LA TARGETA ({lang.toUpperCase()})
                          </label>
                          <input
                            type="text"
                            value={currentEditingProject.i18n?.[lang]?.shortDesc || ''}
                            onChange={(e) => handleAdminProjectChange('shortDesc', e.target.value, lang)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>

                        <div>
                          <label className="block text-[10px] font-field-medium uppercase tracking-wider text-[#FCF0D6]/60 mb-1">
                            SINOPSI COMPLETA DEL MODAL ({lang.toUpperCase()})
                          </label>
                          <textarea
                            rows={3}
                            value={currentEditingProject.i18n?.[lang]?.description || ''}
                            onChange={(e) => handleAdminProjectChange('description', e.target.value, lang)}
                            className="w-full bg-black border border-white/20 px-2.5 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                          />
                        </div>
                      </div>

                      <button
                        type="button"
                        onClick={() => saveChanges(projects, heroVideoUrl, aboutPhotoUrl)}
                        className="w-full py-3 bg-[#B40023] hover:bg-red-700 text-white font-field-bold text-xs tracking-[0.22em] uppercase rounded-[2px] flex items-center justify-center gap-2 transition-colors"
                      >
                        <IconSave className="w-4 h-4" />
                        <span>{saveStatus || 'DESAR ELS CANVIS'}</span>
                      </button>
                    </div>
                  )}

                  {adminTab === 'global' && (
                    <div className="space-y-6">
                      <div className="space-y-2">
                        <div className="font-field-bold text-xs tracking-[0.2em] uppercase text-[#B40023]">
                          1. VÍDEO PRINCIPAL DE PORTADA (.MP4)
                        </div>
                        <input
                          type="text"
                          value={heroVideoUrl}
                          onChange={(e) => setHeroVideoUrl(e.target.value)}
                          className="w-full bg-black border border-white/20 px-3 py-2.5 text-xs text-[#FCF0D6] rounded-[2px]"
                        />
                      </div>

                      <div className="space-y-2.5 pt-4 border-t border-white/10">
                        <div className="font-field-bold text-xs tracking-[0.2em] uppercase text-[#B40023]">
                          2. FOTO B&amp;W MARC I JORDI (SOBRE NOSALTRES)
                        </div>
                        <label className="block p-3.5 border border-dashed border-[#FCF0D6]/30 hover:border-[#B40023] rounded-[3px] cursor-pointer transition-colors bg-black/50">
                          <div className="flex items-center justify-between">
                            <span className="font-field-bold text-xs uppercase text-[#FCF0D6]">
                              PUJAR FOTO DES DE L'ORDINADOR / MÒBIL
                            </span>
                            <IconUpload className="w-4 h-4 text-[#B40023]" />
                          </div>
                          <input
                            type="file"
                            accept="image/*"
                            onChange={handleAboutPhotoUpload}
                            className="hidden"
                          />
                        </label>
                        <input
                          type="text"
                          value={aboutPhotoUrl}
                          onChange={(e) => setAboutPhotoUrl(e.target.value)}
                          placeholder="O enganxa l'enllaç directe de la foto..."
                          className="w-full bg-black border border-white/20 px-3 py-2 text-xs text-[#FCF0D6] rounded-[2px]"
                        />
                      </div>

                      <div className="space-y-3 pt-4 border-t border-white/10">
                        <div className="font-field-bold text-xs tracking-[0.2em] uppercase text-[#B40023]">
                          3. PROVAR ARXIUS .TTF EN VIU
                        </div>
                        <label className="block p-3.5 border border-dashed border-[#FCF0D6]/30 hover:border-[#B40023] rounded-[3px] cursor-pointer bg-black/50">
                          <div className="flex items-center justify-between">
                            <span className="font-nicholas text-base text-[#FCF0D6]">
                              {loadedFontsStatus.nicholas ? `✓ ${loadedFontsStatus.nicholas}` : 'Carregar Nicholas.ttf'}
                            </span>
                            <IconUpload className="w-4 h-4 text-[#B40023]" />
                          </div>
                          <input
                            type="file"
                            accept=".ttf,.otf,.woff,.woff2"
                            onChange={(e) => handleFontFileUpload(e, 'nicholas')}
                            className="hidden"
                          />
                        </label>

                        <label className="block p-3.5 border border-dashed border-[#FCF0D6]/30 hover:border-[#B40023] rounded-[3px] cursor-pointer bg-black/50">
                          <div className="flex items-center justify-between">
                            <span className="font-field-bold text-xs uppercase text-[#FCF0D6]">
                              {loadedFontsStatus.fieldGothic ? `✓ ${loadedFontsStatus.fieldGothic}` : 'Carregar FieldGothicWide.ttf'}
                            </span>
                            <IconUpload className="w-4 h-4 text-[#B40023]" />
                          </div>
                          <input
                            type="file"
                            accept=".ttf,.otf,.woff,.woff2"
                            onChange={(e) => handleFontFileUpload(e, 'fieldGothic')}
                            className="hidden"
                          />
                        </label>
                      </div>

                      <button
                        type="button"
                        onClick={() => saveChanges(projects, heroVideoUrl, aboutPhotoUrl)}
                        className="w-full py-3 bg-[#B40023] hover:bg-red-700 text-white font-field-bold text-xs tracking-[0.22em] uppercase rounded-[2px] flex items-center justify-center gap-2"
                      >
                        <IconSave className="w-4 h-4" />
                        <span>{saveStatus || 'DESAR CANVIS GLOBALS'}</span>
                      </button>
                    </div>
                  )}

                  {adminTab === 'export' && (
                    <div className="space-y-4">
                      <div className="font-field-bold text-xs tracking-[0.2em] uppercase text-[#B40023]">
                        EXPORTACIÓ PERMANENT PER A VERCEL
                      </div>
                      <p className="font-field-regular text-xs text-[#FCF0D6]/75 leading-relaxed">
                        Quan hagis omplert tots els teus vídeos de Vimeo/YouTube i descripcions des d'aquí, copia aquest JSON i envia-me'l pel xat (o substitueix <code className="text-[#FFD447]">INITIAL_PROJECTS</code> dins l'arxiu <code className="text-[#FFD447]">index.html</code>) perquè quedi gravat permanentment al teu domini <strong className="text-white">ventura.ad</strong>:
                      </p>
                      <pre className="bg-black border border-white/15 p-3 rounded-[2px] text-[10px] text-[#FCF0D6]/80 overflow-x-auto max-h-64">
                        {JSON.stringify({ heroVideoUrl, aboutPhotoUrl, projects }, null, 2)}
                      </pre>
                      <button
                        type="button"
                        onClick={() => {
                          copyTextToClipboard(
                            JSON.stringify({ heroVideoUrl, aboutPhotoUrl, projects }, null, 2)
                          );
                          setExportedCopied(true);
                          setTimeout(() => setExportedCopied(false), 2500);
                        }}
                        className="w-full py-3 bg-[#FCF0D6] text-black hover:bg-[#B40023] hover:text-white font-field-bold text-xs tracking-[0.22em] uppercase rounded-[2px] flex items-center justify-center gap-2 transition-colors"
                      >
                        <IconCode className="w-4 h-4" />
                        <span>{exportedCopied ? 'JSON COPIAT ✓' : 'COPIAR CONFIGURACIÓ JSON'}</span>
                      </button>
                    </div>
                  )}
                </div>

                <div className="pt-6 border-t border-white/10 flex items-center justify-between text-[10px] font-field-medium uppercase tracking-widest text-[#FCF0D6]/50">
                  <span>DRECERA: SHIFT + D</span>
                  <span>CONTRASENYA: ventura</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
